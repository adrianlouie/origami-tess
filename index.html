<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origami tessellation viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #steps {
        position: fixed;
        bottom: 8px;
        left: 8px;
        right: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #fold {
        width: 160px;
      }
      #view {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="steps">
      <button id="step-prev" type="button">Prev</button>
      <button id="step-next" type="button">Next</button>
      <output id="step-text">Pick a step to begin.</output>
    </div>
    <div id="bar">
      <select id="gadget" aria-label="Gadget"></select>
      <button id="reset" type="button">Reset view</button>
      <input id="fold" type="range" min="0" max="100" value="0" aria-label="Fold percentage" />
      <output id="readout" for="fold">fold 0 %</output>
      <label>Front <input id="paper-front" type="color" value="#f5ecd7" /></label>
      <label>Back <input id="paper-back" type="color" value="#8fa9c4" /></label>
      <button id="export-svg" type="button">Export SVG</button>
      <button id="export-pdf" type="button">Export PDF</button>
      <button id="export-steps-svg" type="button">Steps SVG</button>
      <button id="export-steps-pdf" type="button">Steps PDF</button>
      <select id="page" aria-label="PDF page size">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
      </select>
    </div>
    <script type="module" src="/app/viewer/main.ts"></script>
  </body>
</html>
