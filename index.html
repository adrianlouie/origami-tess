<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origami tessellation viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
      }
      #view {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar">
      <select id="gadget" aria-label="Gadget"></select>
      <button id="reset" type="button">Reset view</button>
    </div>
    <script type="module" src="/app/viewer/main.ts"></script>
  </body>
</html>
